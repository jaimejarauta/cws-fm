[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cws-fm"
version = "0.1.0"
description = "Causal Wavefront Simplex Flow Matching (CWS-FM) for Non-Autoregressive Language Modeling in <= 8 Steps"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]
